services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teich_forum
      POSTGRES_USER: teich
      POSTGRES_PASSWORD: teich
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teich -d teich_forum"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  forum:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL}
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL}
        NEXT_PUBLIC_CLERK_ACCESS_MODE: ${NEXT_PUBLIC_CLERK_ACCESS_MODE}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    env_file:
      - ${FORUM_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql://teich:teich@database:5432/teich_forum?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:${FORUM_PORT:-3000}
      NEXT_PUBLIC_CLERK_ACCESS_MODE: ${NEXT_PUBLIC_CLERK_ACCESS_MODE:-public}
    ports:
      - "${FORUM_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped

  database-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teich_forum_test
      POSTGRES_USER: teich_test
      POSTGRES_PASSWORD: teich_test
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teich_test -d teich_forum_test"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
